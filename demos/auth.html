<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flint UI — auth shell demo</title>
<link rel="stylesheet" href="../css/flint.css">
<script src="../js/flint.js" defer></script>
</head>
<body class="fl-reset">

<!-- Auth shell: the card is the whole page; flint.js only powers the
     password toggle — the form works without it. -->
<div class="fl-shell-auth">

  <main class="fl-shell-auth__content">
    <form class="fl-auth-card" action="#" method="post">
      <h1 class="fl-auth-card__title">Sign in</h1>
      <p class="fl-auth-card__subtitle">Use your Flint account to continue.</p>

      <div class="fl-field">
        <label class="fl-field__label" for="au-email">Email</label>
        <div class="fl-field__box">
          <input class="fl-field__input" id="au-email" type="email" name="email" autocomplete="email" required>
        </div>
      </div>

      <div class="fl-field">
        <label class="fl-field__label" for="au-pass">Password</label>
        <div class="fl-field__box">
          <input class="fl-field__input" id="au-pass" type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="fl-field__icon fl-field__icon--trailing" data-fl-password-toggle
                  aria-controls="au-pass" aria-label="Show password">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
              <path d="M12 6a9.77 9.77 0 0 1 8.88 5.5A9.77 9.77 0 0 1 12 17a9.77 9.77 0 0 1-8.88-5.5A9.77 9.77 0 0 1 12 6m0-2C7 4 2.73 7.11 1 11c1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 5a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="margin-top:16px; text-align:right;">
        <a href="#">Forgot password?</a>
      </div>

      <div style="margin-top:24px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <a href="#">Create account</a>
        <button class="fl-btn fl-btn--filled" type="submit">Sign in</button>
      </div>
    </form>
  </main>

</div>

</body>
</html>
