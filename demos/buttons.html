<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flint UI — buttons demo</title>
<link rel="stylesheet" href="../css/flint.css">
</head>
<body class="fl-reset">

<main style="max-width:640px; margin:0 auto; padding:32px 20px;">

  <p class="fl-section-label">Variants</p>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button class="fl-btn fl-btn--filled">Filled</button>
    <button class="fl-btn fl-btn--outline">Outline</button>
    <button class="fl-btn fl-btn--text">Text</button>
  </div>

  <p class="fl-section-label">With icons</p>
  <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
    <button class="fl-btn fl-btn--filled"><span class="fl-icon" aria-hidden="true" style="margin-right:8px;"></span>Add item</button>
    <button class="fl-btn fl-btn--outline">Save draft<span class="fl-icon" aria-hidden="true" style="margin-left:8px;"></span></button>
  </div>

  <p class="fl-section-label">Adjacent buttons (dialogs, cards)</p>
  <div style="display:flex; gap:8px; justify-content:flex-end;">
    <button class="fl-btn fl-btn--text">Cancel</button>
    <button class="fl-btn fl-btn--filled">Confirm</button>
  </div>

  <p class="fl-section-label">Icon button · FAB</p>
  <div style="display:flex; gap:12px; align-items:center;">
    <button class="fl-icon-btn" aria-label="More options"><span class="fl-icon" aria-hidden="true"></span></button>
    <button class="fl-fab" aria-label="Compose"><span class="fl-icon" aria-hidden="true"></span></button>
  </div>

</main>

</body>
</html>
