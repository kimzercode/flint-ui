<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flint UI — auth shell demo</title>
<link rel="stylesheet" href="../css/flint.css">
</head>
<body class="fl-reset">

<!-- Auth shell: zero JS — no app chrome, the card is the whole page -->
<div class="fl-shell-auth">

  <main class="fl-shell-auth__content">
    <form class="fl-auth-card" action="#" method="post">
      <h1 class="fl-auth-card__title">Sign in</h1>
      <p class="fl-auth-card__subtitle">Use your Flint account to continue.</p>

      <label class="fl-field">
        <span class="fl-field__label">Email</span>
        <input class="fl-field__input" type="email" name="email" autocomplete="email" required>
      </label>

      <label class="fl-field">
        <span class="fl-field__label">Password</span>
        <input class="fl-field__input" type="password" name="password" autocomplete="current-password" required>
      </label>

      <div style="margin-top:16px; text-align:right;">
        <a href="#">Forgot password?</a>
      </div>

      <div style="margin-top:24px; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <a href="#">Create account</a>
        <button class="fl-btn fl-btn--filled" type="submit">Sign in</button>
      </div>
    </form>
  </main>

</div>

</body>
</html>
